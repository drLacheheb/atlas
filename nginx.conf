server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        
        # Support clean URLs without trailing slashes or file extensions
        try_files $uri $uri/ $uri.html =404;
    }

    # Custom 404 page fallback if any
    error_page 404 /404.html;
    location = /404.html {
        root /usr/share/nginx/html;
        internal;
    }

    # Cache control for highly optimized static assets (images, fonts, bundles)
    location ~* \.(?:ico|css|js|gif|jpe?g|png|svg|webp|woff2?|webmanifest)$ {
        root /usr/share/nginx/html;
        expires 1y;
        access_log off;
        add_header Cache-Control "public, no-transform";
    }
}
